services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: wholesome-swolesome-dev:latest
    container_name: wholesome-dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    ports:
      # trunk serve default
      - "8080:8080"
    volumes:
      # Repo bind-mount (read/write). Host = ../  relative to this file.
      - ../:/workspace
      # Claude CLI auth — reuse host credentials.
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      # Persist Rust build state across container runs without polluting
      # the host's macOS target/ dir (different triple — would conflict).
      - cargo-registry:/home/node/.cargo/registry
      - cargo-git:/home/node/.cargo/git
      - target-cache:/workspace/target
    # Bind trunk serve to all interfaces so the host can reach :8080.
    environment:
      - TRUNK_SERVE_ADDRESS=0.0.0.0
    command: bash

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
