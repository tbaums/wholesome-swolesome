services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: wholesome-swolesome-dev:latest
    container_name: wholesome-dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    ports:
      # trunk serve default
      - "8080:8080"
    volumes:
      # Repo bind-mount (read/write). Host = ../  relative to this file.
      - ../:/workspace

      # Container-owned Claude home. Persists across `docker compose down`
      # so settings, history, sessions, and projects survive restarts.
      # We deliberately do NOT mount the host's ~/.claude here: it carries
      # /Users/... paths and is actively read/written by the host CLI,
      # which races with the container and corrupts ~/.claude.json.
      - claude-home:/home/node/.claude

      # Auth credentials, extracted from the host (macOS Keychain on Darwin,
      # ~/.claude/.credentials.json on Linux) by run.sh on first creation.
      # Mounted read-write so the in-container CLI can refresh expiring OAuth
      # access tokens in place. The file lives under ~/.claude-container/ on
      # the host (NOT the host's ~/.claude or Keychain), so writes here can't
      # trample host auth state.
      - ${HOME}/.claude-container/.credentials.json:/home/node/.claude/.credentials.json

      # Share the user's global CLAUDE.md read-only so behavior in-container
      # matches behavior on the host.
      - ${HOME}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md:ro

      # GitHub CLI OAuth token + git identity, extracted from the host by
      # run.sh. The entrypoint feeds the token into `gh auth login` and runs
      # `gh auth setup-git` so both `gh` and plain `git push/pull` work.
      - ${HOME}/.claude-container/gh-token:/run/host-gh-token:ro
      - ${HOME}/.claude-container/git-identity:/run/host-git-identity:ro

      # Persist Rust build state across container runs without polluting
      # the host's macOS target/ dir (different triple — would conflict).
      # target-cache lives at /home/node/target (not /workspace/target) so
      # the named volume inherits node ownership from the image; mounting
      # under the bind-mounted /workspace masks any pre-set perms and
      # leaves the fresh volume root-owned + unwriteable to `node`.
      - cargo-registry:/home/node/.cargo/registry
      - cargo-git:/home/node/.cargo/git
      - target-cache:/home/node/target
    # Bind trunk serve to all interfaces so the host can reach :8080.
    # CARGO_TARGET_DIR routes builds into the relocated target-cache volume.
    environment:
      - TRUNK_SERVE_ADDRESS=0.0.0.0
      - CARGO_TARGET_DIR=/home/node/target
    # No `command:` — image CMD is `sleep infinity` so the container idles
    # in the background and we attach via `docker compose exec`.

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
  claude-home:
