# Cuts a release: creates the tag at the chosen commit and publishes a GitHub
# Release with auto-generated notes.
#
# Two triggers:
#   - Manual: Actions → Release → Run workflow, with the tag as input.
#   - Version-file bump: merging a change to `.release-version` into main
#     releases that tag automatically. This is the path remote agent sessions
#     use — they can't push tags through the git proxy or dispatch workflows,
#     but they can land a version bump via PR.
#
# Re-running for an existing tag is a no-op, so a no-change merge to
# .release-version can't clobber a published release.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v0.1.0)"
        required: true
  push:
    branches: [main]
    paths: [".release-version"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(cat .release-version)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
